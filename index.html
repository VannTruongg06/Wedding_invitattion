<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngày Chung Đôi - Huyền Trang & Đức Trí</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Container chính để hỗ trợ cuộn sau này -->
    <main class="album-container">

        <!-- Trang bìa -->
        <section class="photo-card cover-page">
            <div class="overlay"></div>
            <!-- Sử dụng class để định dạng ảnh nền trong CSS -->
            <div class="bg-image">
                <img src="./img/BG1.jpg" alt="Cover Image">
            </div>

            <div class="content-wrapper">
                <div class="main-title">
                    <h1 class="script-font">Ngày</h1>
                    <h1 class="script-font">Chung Đôi</h1>
                </div>

                <div class="footer-info">
                    <div class="couple-name">
                        <span>Cô Dâu</span>
                        <h2>Huyền Trang</h2>
                    </div>
                    <div class="date">
                        <p>10.06.2026</p>
                    </div>
                    <div class="couple-name">
                        <span>Chú Rể</span>
                        <h2>Đức Trí</h2>
                    </div>
                </div>
            </div>
        </section>

    </main>
</body>

</html>
